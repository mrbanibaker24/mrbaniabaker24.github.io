<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Me</title>
  <link rel="stylesheet" href="style.css">
  <script src="contact.js" defer></script>
</head>
<body>
  <header>
    <nav aria-label="Main menu">
      <a href="index.html">Home</a>
      <a href="contact.html" aria-current="page">Contact Me</a>
    </nav>
  </header>
  <main>
    <section>
      <h1>Contact Me</h1>
      <p>This form is a demo. Use the email link on the home page to send me a message.</p>
      <form id="contact-form" novalidate>
        <label for="full-name">Full Name</label>
        <input id="full-name" name="full-name" autocomplete="name" required>

        <label for="email">Email Address</label>
        <input id="email" name="email" type="email" autocomplete="email" required>

        <label for="country">Country</label>
        <input id="country" name="country" autocomplete="country-name" required>

        <label for="comments">Comments</label>
        <textarea id="comments" name="comments" rows="5" required></textarea>

        <p id="form-error" role="alert"></p>
        <button type="submit">Submit</button>
      </form>
    </section>
  </main>
</body>
</html>
